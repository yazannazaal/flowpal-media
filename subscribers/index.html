<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1F26">
<title>لوحة المشتركين | Flowpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<!-- supabase-js v2, exact pinned version -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#0E1F26; --ink-2:#1B323C; --teal:#14B8A6; --teal-ink:#0B7A6E; --paper:#F7F5F0; --card:#FFFFFF;
  --line:#DDD8CC; --muted:#5A6A70; --soft:#EEEBE3;
  --h-green:#2E9E5B; --h-yellow:#D4950F; --h-red:#D2453F; --h-unknown:#9AA5A9;
  --radius:10px; --gutter:16px;
  --f-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-head:"Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--f-body);overflow-x:hidden}
a{color:var(--teal-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.bar{background:var(--ink);color:#E9EFEF;position:sticky;top:0;z-index:5}
.bar-in{max-width:1080px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;gap:12px}
.brand{font:600 17px/1.2 var(--f-head);color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand-mark{width:12px;height:12px;border-radius:3px;background:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.25)}
.bar .spacer{flex:1}
.who{font-size:13px;color:#A9BCC0;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ghost{background:transparent;border:1px solid #33505B;color:#E9EFEF;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn-ghost:hover{border-color:var(--teal)}
.demo-flag{background:#F3D27A;color:var(--ink);font-size:13px;text-align:center;padding:6px var(--gutter)}

main{max-width:1080px;margin:0 auto;padding:20px var(--gutter) 64px}
h1,h2,h3{font-family:var(--f-head);line-height:1.3;margin:0}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons, inputs */
.btn{background:var(--teal);color:#05221E;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:#12A595}
.btn:disabled{opacity:.6;cursor:default}
.btn-line{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn-line:hover{border-color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input.i,select.i,textarea.i{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(20,184,166,.2)}
.err{color:var(--h-red);font-size:14px;min-height:1.4em;margin-top:8px}
.ok{color:var(--teal-ink);font-size:14px;min-height:1.4em;margin-top:8px}

/* login */
.login{max-width:380px;margin:8vh auto 0}
.login h1{margin-bottom:4px}
.login .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:20px}
.login .btn{width:100%;margin-top:16px}

/* list */
.list-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:14px}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tally b{color:var(--ink);font-weight:600}
.subs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sub{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sub a.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px 14px 14px;padding-inline-start:22px;text-decoration:none;color:inherit}
.sub a.row:hover{background:#FCFBF8}
.sub .band{position:absolute;inset-block:0;inset-inline-start:0;width:6px}
.sub .name{font:600 17px/1.35 var(--f-head)}
.sub .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.sub .meta span{white-space:nowrap}
.sub .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sub .mid{grid-column:1/-1;display:grid;gap:8px}
.sub .dates{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.sub .dates span{white-space:nowrap}
.sub .dates em{font-style:normal;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.status{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.status.live{border-color:#9FD9CF;background:#E7F7F4;color:var(--teal-ink)}
.status.paused{background:#FBF1DC;border-color:#EBCF8F}
.status.ended{background:var(--soft);color:var(--muted)}

/* health badge */
.health{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.health i{width:10px;height:10px;border-radius:50%;display:inline-block}
.h-green{--h:var(--h-green)} .h-yellow{--h:var(--h-yellow)} .h-red{--h:var(--h-red)} .h-unknown{--h:var(--h-unknown)}
.health i,.band{background:var(--h)}
.h-red .health i,.health.h-red i{box-shadow:0 0 0 4px rgba(210,69,63,.18)}

/* subscriber page */
.back{display:inline-block;font-size:14px;margin-bottom:12px;text-decoration:none}
.back:hover{text-decoration:underline}
.sp-head{background:var(--ink);color:#EAF1F1;border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.sp-head .band{position:absolute;inset-block:0;inset-inline-start:0;width:8px}
.sp-head h1{color:#fff;padding-inline-start:6px}
.sp-head .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:#A9BCC0;margin-top:6px;padding-inline-start:6px}
.sp-head .healthbox{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--ink-2);margin-inline-start:6px}
.sp-head .health{color:#fff}
.sp-head .hnote{font-size:13px;color:#C7D4D6;margin-top:4px;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:14px;padding-inline-start:6px}
.facts div{font-size:13px;color:#A9BCC0}
.facts b{display:block;color:#fff;font-weight:500;font-size:14px}

.grid{display:grid;gap:16px;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.panel > h2{margin-bottom:10px}
dl.kv{margin:0;display:grid;gap:10px}
dl.kv dt{font-size:12px;color:var(--muted)}
dl.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.wf{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wf li{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.wf .id{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;direction:ltr;unicode-bidi:isolate}
.wf .role{font-size:13px;color:var(--muted)}
.contacts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.contacts li{font-size:14px;overflow-wrap:anywhere}
.ltr{direction:ltr;unicode-bidi:isolate}

/* chart */
.chart-wrap{margin-top:4px}
.chart-empty{border:1px dashed var(--line);border-radius:8px;padding:22px 12px;text-align:center;color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;direction:ltr;padding-top:6px}
.day{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.day .bar-v{background:var(--teal);border-radius:3px 3px 0 0;min-height:2px}
.day .hdot{height:5px;border-radius:2px;margin-top:3px;background:var(--h, var(--soft))}
.axis{display:flex;justify-content:space-between;direction:ltr;font-size:11px;color:var(--muted);margin-top:4px}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mstats div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.mstats b{display:block;font:600 18px/1.3 var(--f-head);color:var(--ink)}

/* timeline */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{list-style:none;margin:0;padding:0}
.note{position:relative;padding:12px 0 12px;padding-inline-start:20px;border-top:1px solid var(--soft)}
.note:first-child{border-top:0}
.note::before{content:"";position:absolute;inset-inline-start:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--k)}
.k-note{--k:#8A969A} .k-issue{--k:var(--h-red)} .k-change{--k:var(--teal)} .k-request{--k:#5B6CCF}
.note .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.note .title{font-weight:600}
.note .kind{font-size:12px;color:var(--k);font-weight:600}
.note .body{margin:4px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.note .ref{overflow-wrap:anywhere}
.nstat{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft)}
.nstat.open{background:#FDECEA;color:#9B2C27}
.nstat.in_progress{background:#FBF1DC;color:#7A5605}
.nstat.done{background:#E7F7F4;color:var(--teal-ink)}
.note.closed .title{color:var(--muted)}
.note .acts{display:flex;gap:6px;margin-inline-start:auto}
.note .acts button{font-size:12px;padding:4px 9px}
.addform{border-top:1px solid var(--line);margin-top:12px;padding-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toast{position:fixed;bottom:16px;inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;z-index:20;text-align:center}

/* modal */
dialog{border:0;border-radius:var(--radius);padding:20px;width:min(380px,calc(100vw - 32px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(14,31,38,.5)}
dialog .row-btns{display:flex;gap:8px;margin-top:16px}

@media (min-width:760px){
  h1{font-size:28px}
  .sub a.row{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 150px;grid-template-areas:"a b c";align-items:center;padding:16px 18px;padding-inline-start:26px}
  .sub a.row > div:first-child{grid-area:a} .sub .mid{grid-area:b;grid-column:auto} .sub .rt{grid-area:c}
  .grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
  .grid .full{grid-column:1/-1}
  .facts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sp-head{padding:22px 24px}
  .days{height:150px}
}
@media (prefers-reduced-motion:no-preference){
  .day .bar-v{transition:height .3s ease}
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>لوحة المشتركين</a>
    <span class="spacer"></span>
    <span class="who hidden" id="who"></span>
    <button class="btn-ghost hidden" id="btnPw" type="button">تغيير كلمة المرور</button>
    <button class="btn-ghost hidden" id="btnOut" type="button">خروج</button>
  </div>
</header>
<div class="demo-flag hidden" id="demoFlag">وضع تجريبي: كل البيانات هنا وهمية، والتعديلات لا تُحفظ.</div>

<main id="app" aria-live="polite"></main>

<dialog id="pwDlg">
  <form id="pwForm" method="dialog">

    <label class="f" for="pw1">كلمة المرور الجديدة (8 أحرف على الأقل)</label>
    <input class="i" id="pw1" type="password" minlength="8" autocomplete="new-password" required>
    <label class="f" for="pw2">أعد كتابتها</label>
    <input class="i" id="pw2" type="password" minlength="8" autocomplete="new-password" required>
    <div class="err" id="pwErr"></div>
    <div class="row-btns">
      <button class="btn" type="submit" id="pwSave">حفظ كلمة المرور</button>
      <button class="btn-line" type="button" id="pwCancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script>
/* ===== Config =====
   The ONLY key allowed in this file is the Supabase anon (publishable) key. It is public by design;
   Row Level Security + the subscriber_staff allowlist protect the data. Never put a service_role key here. */
const SUPABASE_URL = "https://kltkjkraevxltmxfetng.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YOUiGYUqctqUkB63MIkVmw_raLYKQ6v";

const DEMO = new URLSearchParams(location.search).has("demo");
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");

/* ===== Labels ===== */
const L = {
  status: { onboarding: "قيد التجهيز", live: "يعمل", paused: "متوقف مؤقتاً", ended: "منتهي" },
  health: { green: "سليم", yellow: "يحتاج متابعة", red: "فيه عطل", unknown: "غير معروف" },
  kind: { note: "ملاحظة", issue: "مشكلة", change: "تعديل", request: "طلب" },
  nstat: { open: "مفتوح", in_progress: "قيد العمل", done: "منجز", wont_do: "لن يُنفَّذ" },
  channel: { instagram: "Instagram", messenger: "Messenger", whatsapp: "WhatsApp", web_chat: "دردشة الموقع" },
  contactRole: { owner: "المالك", manager: "المدير", staff: "موظف", tech: "تقني" },
};

/* ===== Helpers ===== */
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const dFmt = new Intl.DateTimeFormat("ar-u-nu-latn", { day: "numeric", month: "short", year: "numeric" });
const dtFmt = new Intl.DateTimeFormat("ar-u-nu-latn", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtDate = (d) => { if (!d) return "—"; const x = new Date(d.length === 10 ? d + "T00:00:00" : d); return isNaN(x) ? "—" : dFmt.format(x); };
const fmtDT = (d) => { const x = new Date(d); return isNaN(x) ? "" : dtFmt.format(x); };
const healthBadge = (h) => { h = L.health[h] ? h : "unknown"; return `<span class="health h-${h}"><i aria-hidden="true"></i>${L.health[h]}</span>`; };
const isoDay = (dt) => dt.toISOString().slice(0, 10);
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===== Data layer: demo (fake, in memory) or Supabase ===== */
function demoStore() {
  const today = new Date(); const day = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return d; };
  const subs = [
    { id: "demo-store", name: "متجر النخلة (تجريبي)", sector: "متجر إلكتروني / أدوات منزلية", city: "نابلس", address: "شارع تجريبي 1",
      channels: ["instagram", "messenger"], product: "messaging-assistant", status: "live",
      start_date: isoDay(day(20)), golive_date: isoDay(day(18)), end_date: null, contract_version: "v2",
      contacts: [{ role: "owner", name: "صاحب المتجر (وهمي)", channel: "whatsapp", value: "+970 000 000 000" }],
      systems: { meta: "Meta app (demo)", n8n: { host: "n8n.example.com", workflows: [ { id: "DEMOin000000001", name: "[Demo] Messages in", role: "inbound adapter" }, { id: "DEMObot00000002", name: "Demo Staff Reply", role: "AI agent + turns log" } ] }, bot_db: "Demo Postgres, schema bot", dashboard: "Demo client dashboard" },
      links: { dashboard: "https://example.com/dashboard", instagram: "https://example.com/instagram" },
      health: "yellow", health_note: "رسالة فيها رقم فُهمت كرقم منتج. الإصلاح جاهز وينتظر الفحص.", health_at: day(0).toISOString(), notes: "مشترك وهمي للعرض فقط." },
    { id: "demo-clinic", name: "عيادة الريحان (تجريبي)", sector: "عيادة أسنان", city: "رام الله", address: null,
      channels: ["whatsapp"], product: "messaging-assistant", status: "onboarding",
      start_date: isoDay(day(3)), golive_date: null, end_date: null, contract_version: "v1",
      contacts: [{ role: "manager", name: "مديرة العيادة (وهمي)", channel: "phone", value: "+970 000 000 001" }],
      systems: { n8n: { host: "n8n.example.com", workflows: [] } }, links: {},
      health: "unknown", health_note: null, health_at: null, notes: null },
    { id: "demo-cafe", name: "مقهى الزاوية (تجريبي)", sector: "مقهى", city: "جنين", address: null,
      channels: ["instagram"], product: "messaging-assistant", status: "live",
      start_date: isoDay(day(40)), golive_date: isoDay(day(37)), end_date: null, contract_version: "v1",
      contacts: [], systems: { n8n: { host: "n8n.example.com", workflows: [ { id: "DEMOcafe0000003", name: "Cafe bot", role: "AI agent" } ] } }, links: {},
      health: "green", health_note: "لا أخطاء آخر 7 أيام.", health_at: day(0).toISOString(), notes: null },
  ];
  let nid = 100;
  const notes = [
    { id: 1, subscriber_id: "demo-store", kind: "change", title: "تسليم النظام وبدء الاشتراك", body: "Instagram + Messenger شغالين.", status: "done", ref: "contract v2", author: "نادر", at: day(18).toISOString(), closed_at: day(18).toISOString() },
    { id: 2, subscriber_id: "demo-store", kind: "change", title: "فهم الرسائل الصوتية", body: null, status: "done", ref: "changelog", author: "نادر", at: day(9).toISOString(), closed_at: day(9).toISOString() },
    { id: 3, subscriber_id: "demo-store", kind: "issue", title: "رقم لحاله ينقرأ كرقم منتج", body: "الزبون كتب رقماً في رسالته، والبوت أرسل صورة منتج غلط.", status: "in_progress", ref: "exec 0000", author: "هبة", at: day(1).toISOString(), closed_at: null },
    { id: 4, subscriber_id: "demo-store", kind: "request", title: "الرد على الستوري", body: "صاحب المتجر طلب أن يرد البوت على ردود الستوري.", status: "open", ref: null, author: "أسماء", at: day(0).toISOString(), closed_at: null },
    { id: 5, subscriber_id: "demo-store", kind: "note", title: "ساعات الذروة مساءً", body: "أغلب الرسائل بين 8 و 11 مساءً.", status: "done", ref: null, author: "أسماء", at: day(5).toISOString(), closed_at: day(5).toISOString() },
    { id: 6, subscriber_id: "demo-clinic", kind: "request", title: "تجهيز رقم WhatsApp", body: null, status: "open", ref: null, author: "نادر", at: day(2).toISOString(), closed_at: null },
    { id: 7, subscriber_id: "demo-cafe", kind: "change", title: "تحديث قائمة المشروبات", body: null, status: "done", ref: null, author: "طارق", at: day(6).toISOString(), closed_at: day(6).toISOString() },
  ];
  const metrics = [];
  for (let i = 13; i >= 0; i--) {
    const t = 30 + Math.round(25 * Math.abs(Math.sin(i * 1.7))) + (i % 7 === 5 ? 20 : 0);
    const err = i === 1 ? 2 : (i === 6 ? 1 : 0);
    metrics.push({ subscriber_id: "demo-store", day: isoDay(day(i)), turns: t, conversations: Math.round(t / 3), bot_errors: err, unanswered: i === 1 ? 1 : 0, handoffs: i % 4 === 0 ? 2 : 1, orders: i % 3, median_reply_sec: 6 + (i % 5), health: err >= 2 ? "yellow" : "green" });
  }
  return {
    async session() { return { email: "demo@example.com" }; },
    async me() { return { email: "demo@example.com", name: "زائر تجريبي", role: "tech", active: true }; },
    async signIn() {}, async signOut() {}, async setPassword() {},
    async listSubscribers() {
      return subs.map((s) => ({ ...s, open_count: notes.filter((n) => n.subscriber_id === s.id && (n.status === "open" || n.status === "in_progress")).length }));
    },
    async getSubscriber(id) { return subs.find((s) => s.id === id) || null; },
    async listNotes(id) { return notes.filter((n) => n.subscriber_id === id).sort((a, b) => b.at.localeCompare(a.at)); },
    async addNote(n) { notes.push({ ...n, id: ++nid, at: new Date().toISOString(), closed_at: null }); },
    async setNoteStatus(id, status) { const n = notes.find((x) => x.id === id); if (n) { n.status = status; n.closed_at = (status === "done" || status === "wont_do") ? new Date().toISOString() : null; } },
    async metrics(id) { return metrics.filter((m) => m.subscriber_id === id); },
  };
}

function supaStore() {
  if (!window.supabase || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.startsWith("PASTE_")) return null;
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  let meCache = null;
  return {
    sb,
    async session() { const { data } = await sb.auth.getSession(); return data.session ? { email: data.session.user.email } : null; },
    async me() {
      if (meCache) return meCache;
      const s = await this.session(); if (!s) return null;
      const rows = ok(await sb.from("subscriber_staff").select("email,name,role,active").eq("email", (s.email || "").toLowerCase()).limit(1));
      meCache = rows[0] || null; return meCache;
    },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); meCache = null; },
    async signOut() { await sb.auth.signOut(); meCache = null; },
    async setPassword(pw) { ok(await sb.auth.updateUser({ password: pw })); },
    async listSubscribers() {
      const subs = ok(await sb.from("subscribers").select("id,name,sector,city,channels,status,start_date,golive_date,contract_version,health,health_note,health_at").order("name"));
      const open = ok(await sb.from("subscriber_notes").select("subscriber_id").in("status", ["open", "in_progress"]));
      return subs.map((s) => ({ ...s, open_count: open.filter((n) => n.subscriber_id === s.id).length }));
    },
    async getSubscriber(id) { const r = ok(await sb.from("subscribers").select("*").eq("id", id).limit(1)); return r[0] || null; },
    async listNotes(id) { return ok(await sb.from("subscriber_notes").select("*").eq("subscriber_id", id).order("at", { ascending: false }).limit(500)); },
    async addNote(n) { ok(await sb.from("subscriber_notes").insert(n)); },
    async setNoteStatus(id, status) {
      const closed_at = (status === "done" || status === "wont_do") ? new Date().toISOString() : null;
      ok(await sb.from("subscriber_notes").update({ status, closed_at }).eq("id", id));
    },
    async metrics(id) {
      const from = new Date(); from.setDate(from.getDate() - 29);
      return ok(await sb.from("subscriber_metrics_daily").select("day,turns,conversations,bot_errors,unanswered,handoffs,orders,median_reply_sec,health").eq("subscriber_id", id).gte("day", isoDay(from)).order("day"));
    },
  };
}

function chartHTML(rows) {
  const data = (rows || []).filter((r) => r.turns != null || r.bot_errors != null);
  if (!data.length) return `<div class="chart-empty">لا بيانات بعد</div><p class="muted small">الأرقام اليومية تظهر هنا تلقائياً بعد تشغيل المتابعة الليلية.</p>`;
  const max = Math.max(1, ...data.map((r) => r.turns || 0));
  const sum = (k) => data.reduce((a, r) => a + (r[k] || 0), 0);
  const bars = data.map((r) => {
    const pct = Math.round(((r.turns || 0) / max) * 100);
    const h = r.health ? `h-${r.health}` : "";
    return `<div class="day ${h}" title="${esc(fmtDate(r.day))}: ${r.turns ?? 0} رسالة، ${r.bot_errors ?? 0} خطأ"><div class="bar-v" style="height:${pct}%"></div><div class="hdot"></div></div>`;
  }).join("");
  return `<div class="chart-wrap" role="img" aria-label="رسائل الزبائن اليومية آخر ${data.length} يوم">
      <div class="days">${bars}</div>
      <div class="axis"><span>${esc(fmtDate(data[0].day))}</span><span>${esc(fmtDate(data[data.length - 1].day))}</span></div>
    </div>
    <p class="muted small" style="margin:6px 0 0">طول العمود = رسائل الزبائن في اليوم، والشريط تحته = حالة ذلك اليوم.</p>
    <div class="mstats">
      <div><b>${sum("turns")}</b>رسالة</div>
      <div><b>${sum("bot_errors")}</b>خطأ في البوت</div>
      <div><b>${sum("unanswered")}</b>بدون رد</div>
      <div><b>${sum("handoffs")}</b>تحويل لموظف</div>
      <div><b>${sum("conversations")}</b>زبون</div>
      <div><b>${sum("orders")}</b>طلب</div>
    </div>`;
}

function systemsHTML(s) {

  const wfs = Array.isArray(n8n.workflows) ? n8n.workflows : [];
  const wfList = wfs.length ? `<ul class="wf">${wfs.map((w) => {
      const url = host ? safeUrl(`https://${host}/workflow/${encodeURIComponent(w.id || "")}`) : null;
      return `<li><div>${esc(w.name || "workflow")}</div>
        <div>${url ? `<a class="id" href="${esc(url)}" target="_blank" rel="noopener">${esc(w.id)}</a>` : `<span class="id">${esc(w.id)}</span>`}</div>
        ${w.role ? `<div class="role">${esc(w.role)}</div>` : ""}</li>`;
    }).join("")}</ul>` : `<p class="muted small">لا يوجد workflow مسجّل.</p>`;
  const other = Object.entries(sys).filter(([k]) => k !== "n8n");
  return `<dl class="kv">
      <div><dt>n8n${host ? ` <span class="ltr">(${esc(host)})</span>` : ""}</dt><dd>${wfList}</dd></div>

const noteFilter = { kind: "all", status: "active" };

function notesHTML(notes) {
  const list = notes.filter((n) =>
    (noteFilter.kind === "all" || n.kind === noteFilter.kind) &&
    (noteFilter.status === "all" || (noteFilter.status === "active" ? (n.status === "open" || n.status === "in_progress") : (n.status === "done" || n.status === "wont_do"))));
  if (!list.length) return `<p class="muted small">لا يوجد شيء بهذا الفلتر.</p>`;
  return `<ul class="tl">${list.map((n) => {
    const closed = n.status === "done" || n.status === "wont_do";
    return `<li class="note k-${esc(n.kind)} ${closed ? "closed" : ""}">
      <div class="top"><span class="kind">${esc(L.kind[n.kind] || n.kind)}</span><span class="title">${esc(n.title)}</span><span class="nstat ${esc(n.status)}">${esc(L.nstat[n.status] || n.status)}</span></div>
      ${n.body ? `<p class="body">${esc(n.body)}</p>` : ""}
      <div class="foot"><span>${esc(fmtDT(n.at))}</span><span>${esc(n.author)}</span>${n.ref ? `<span class="ref ltr">${esc(n.ref)}</span>` : ""}
        <span class="acts">${closed
          ? `<button class="btn-line" data-st="open" data-id="${n.id}">إعادة فتح</button>`
          : `${n.status === "open" ? `<button class="btn-line" data-st="in_progress" data-id="${n.id}">بدء العمل</button>` : ""}<button class="btn-line" data-st="done" data-id="${n.id}">إغلاق</button>`}</span></div>
    </li>`;
  }).join("")}</ul>`;
}

function filterBtns() {
  const k = [["all", "الكل"], ["issue", "مشاكل"], ["request", "طلبات"], ["change", "تعديلات"], ["note", "ملاحظات"]];
  const s = [["active", "المفتوحة"], ["closed", "المغلقة"], ["all", "الكل"]];
  return `<div class="filters" role="group" aria-label="النوع">${k.map(([v, t]) => `<button class="fbtn" data-fk="${v}" aria-pressed="${noteFilter.kind === v}">${t}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="الحالة">${s.map(([v, t]) => `<button class="fbtn" data-fs="${v}" aria-pressed="${noteFilter.status === v}">${t}</button>`).join("")}</div>`;
}

/* ===== Router ===== */
async function route() {
  if (!store) return viewConfigMissing();
  try {
    const sess = await store.session();
    if (!sess) { app.innerHTML = ""; return viewLogin(); }
    const me = await store.me();
    if (!me || !me.active) return viewNoAccess(sess.email);
    setChrome(me);
    const m = location.hash.match(/^#\/s\/(.+)$/);
    if (m) await viewSubscriber(decodeURIComponent(m[1])); else await viewList();
    window.scrollTo(0, 0);
  } catch (err) {
    app.innerHTML = `<p class="err">تعذّر تحميل البيانات: ${esc(err.message || "خطأ غير معروف")}. حدّث الصفحة، وإذا تكرر الخطأ أبلغ الفريق التقني.</p>`;
  }
}
window.addEventListener("hashchange", route);

$("#btnOut").addEventListener("click", async () => { if (DEMO) { location.href = location.pathname; return; } await store.signOut(); app.innerHTML = ""; location.hash = "#/"; viewLogin(); });

const dlg = $("#pwDlg");
$("#btnPw").addEventListener("click", () => { $("#pwForm").reset(); $("#pwErr").textContent = ""; dlg.showModal(); });
$("#pwCancel").addEventListener("click", () => dlg.close());
$("#pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const a = $("#pw1").value, b = $("#pw2").value;
  if (a.length < 8) { $("#pwErr").textContent = "كلمة المرور يجب أن تكون 8 أحرف على الأقل."; return; }
  if (a !== b) { $("#pwErr").textContent = "الكلمتان غير متطابقتين."; return; }
  $("#pwSave").disabled = true;
  try { await store.setPassword(a); dlg.close(); toast("تم تغيير كلمة المرور"); }
  catch (err) { $("#pwErr").textContent = "تعذّر التغيير: " + (err.message || ""); }
  $("#pwSave").disabled = false;
});

if (store && store.sb) store.sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") { app.innerHTML = ""; viewLogin(); } });
route();
