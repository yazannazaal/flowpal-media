<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>معاينة الجوال · Brands Sport</title>
<link rel="icon" href="assets/flowpal-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
body{background:#e9e7e2;font:400 15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center}
@media (prefers-color-scheme:dark){body{background:#101011;color:#eee}}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;padding:18px 16px 10px}
.bar a.back{font-size:13px;opacity:.7;text-decoration:underline;margin-left:10px}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:999px;padding:4px}
@media (prefers-color-scheme:dark){.seg{background:rgba(255,255,255,.08)}}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500}
.seg button.on{background:#111;color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{background:#fff;color:#111}}
.phone{margin:14px auto 30px;width:414px;height:880px;border-radius:56px;background:#111;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.28),inset 0 0 0 2px #333;position:relative;flex:none}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;z-index:2}
.phone iframe{width:390px;height:856px;border:0;border-radius:44px;background:#fff;display:block}
.hint{font-size:12.5px;opacity:.6;margin-bottom:24px;text-align:center;padding:0 16px}
@media (max-width:480px){.phone{width:auto;height:auto;padding:0;border-radius:0;box-shadow:none;background:none}.phone::before{display:none}.phone iframe{width:100vw;height:80vh;border-radius:0}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html">← كل المفاهيم</a>
  <div class="seg" id="c"><button data-v="1">1 · فاخر</button><button data-v="2">2 · ستريت</button><button data-v="3">3 · تجاري</button></div>
  <div class="seg" id="p"><button data-v="index">الرئيسية</button><button data-v="shop">المنتجات</button><button data-v="product">المنتج</button></div>
</div>
<div class="phone"><iframe id="f" title="معاينة الجوال"></iframe></div>
<p class="hint">التصميم يتفاعل داخل الجوال: مرّر، افتح القائمة، اختر مقاس وأضف للسلة.</p>
<script>
const q = new URLSearchParams(location.search);
let c = q.get('c') || '1', p = q.get('p') || 'index';
const f = document.getElementById('f');
function go() {
  f.src = `c${c}/${p}.html`;
  document.querySelectorAll('#c button').forEach(b => b.classList.toggle('on', b.dataset.v === c));
  document.querySelectorAll('#p button').forEach(b => b.classList.toggle('on', b.dataset.v === p));
  history.replaceState(null, '', `?c=${c}&p=${p}`);
}
document.getElementById('c').onclick = e => { const b = e.target.closest('button'); if (b) { c = b.dataset.v; go(); } };
document.getElementById('p').onclick = e => { const b = e.target.closest('button'); if (b) { p = b.dataset.v; go(); } };
go();
</script>
</body>
</html>
